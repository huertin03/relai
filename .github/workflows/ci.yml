name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Dependencias de systray para Linux
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - run: go vet ./...
      - run: go test ./... -race

  cross:
    # Cada plataforma se compila en su runner nativo. fyne.io/systray necesita
    # cgo para su backend Cocoa en darwin, y cruzar a darwin desde un host
    # linux desactiva cgo por defecto — eso dejaba este job en rojo desde el
    # primer push. windows/amd64 y linux/amd64 sí cruzan bien con cgo
    # desactivado (syscalls y dbus puro Go respectivamente), así que se
    # compilan ambos desde ubuntu-latest.
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ matrix.cgo || '1' }} go build -o /dev/null .
